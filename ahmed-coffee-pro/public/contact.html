<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تواصل معنا — أحمد كوفي</title>
<meta name="description" content="تواصل مع أحمد كوفي: العنوان والموبايل وواتساب ورسالة مباشرة.">
<meta name="theme-color" content="#05060a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="contact">
<main>

<section class="page-head"><div class="eyebrow">Contact</div><h1 class="grad">تواصل معنا</h1><p class="lead">سؤال أو اقتراح أو طلب خاص؟ ابعتلنا ونرد عليك بسرعة.</p></section>
<section><div class="split">
  <div class="info-cards" data-stagger>
    <div class="tilt ic"><small>الموبايل</small><span data-site="phone"></span></div>
    <div class="tilt ic"><small>العنوان</small><span data-site="address"></span></div>
    <div class="tilt ic"><small>مواعيد العمل</small><span data-site="hours"></span></div>
    <a class="cta mag" data-wa target="_blank" rel="noopener" style="text-align:center">كلمنا على واتساب</a>
  </div>
  <form class="tilt form rv" id="msgForm">
    <label>الاسم<input name="name" required maxlength="40"></label>
    <label>رقم الموبايل (اختياري)<input name="phone" type="tel"></label>
    <label>رسالتك<textarea name="text" required maxlength="1000"></textarea></label>
    <button class="cta" type="submit">إرسال</button>
  </form>
</div></section>
</main>
<script src="/app.js"></script>
</body>
</html>
